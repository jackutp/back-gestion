# ========== DATABASE CONFIGURATION ==========
spring.datasource.url=jdbc:postgresql://localhost:5433/solicitudes_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ========== LOGGING ==========
logging.level.com.microservicio.solicitudes=DEBUG

#Prometheus
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always
#Logging
logging.file.name=/var/log/restaurante-gestion/solicitudes.log
logging.pattern.file="%d %-5level [%thread] %logger - %msg%n"
