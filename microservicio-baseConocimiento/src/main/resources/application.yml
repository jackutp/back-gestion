server:
  port: 8005

spring:
  application:
    name: microservicio-baseconocimiento

  datasource:
    url: jdbc:postgresql://localhost:5433/base_conocimiento
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    com.microservicio.baseConocimiento: DEBUG
    org.hibernate.SQL: DEBUG
