server:
  port: 8090
spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:3000"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowed-headers:
                  - Content-Type
                  - Authorization
                  - X-Requested-With
                  - Accept
                  - Origin
                allow-credentials: true
                max-age: 3600
          routes:
            - id: microservicio-users
              uri: lb://microservicio-users
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1
            - id: microservicio-solicitudes
              uri: lb://microservicio-solicitudes
              predicates:
                - Path=/api/solicitudes/**
              filters:
                - StripPrefix=1
            - id: microservicio-cambios
              uri: lb://microservicio-cambios
              predicates:
                - Path=/api/cambios/**
              filters:
                - StripPrefix=1
            - id: microservicio-incidentes
              uri: lb://microservicio-incidentes
              predicates:
                - Path=/api/incidentes/**
              filters:
                - StripPrefix=1
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true