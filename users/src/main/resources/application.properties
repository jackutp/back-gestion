spring.application.name=microservicio-users
server.port=:8221
server.servlet.context-path=/
# PostgreSQL
spring.datasource.url=jdbc:postgresql://${WRITE_SERVER:localhost:5432}/users_db
spring.datasource.username=${USERNAME_WRITE_DB:postgres}
spring.datasource.password=${PASSWORD_WRITE_DB:password}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8762}/eureka
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Logging
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always
logging.file.name=/var/log/restaurante-gestion/user.log
logging.pattern.file="%d %-5level [%thread] %logger - %msg%n"
